services:
  redis:
    image: redis:7-alpine
    platform: linux/amd64
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data

  dtcc-sim:
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: temp/dtcc-sim/Dockerfile
    ports:
      - "8001:8001"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - SHARED_RESULTS_DIR=/shared/results
    depends_on:
      - redis
    volumes:
      - ${DTCC_SHARED_RESULTS:-./data/shared-results}:/shared/results
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/v1/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  dtcc-sim-worker:
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: temp/dtcc-sim/Dockerfile
    command: celery -A service.tasks:celery_app worker -Q dtcc-sim -c 2
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - SHARED_RESULTS_DIR=/shared/results
    depends_on:
      - redis
    volumes:
      - ${DTCC_SHARED_RESULTS:-./data/shared-results}:/shared/results

volumes:
  redis-data:
