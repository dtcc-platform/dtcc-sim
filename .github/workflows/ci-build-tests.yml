name: build-tests

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install package and development dependencies
        run: uv sync --locked
      - name: Run tests
        run: uv run --locked pytest
      - name: Build distributions
        run: uv build
