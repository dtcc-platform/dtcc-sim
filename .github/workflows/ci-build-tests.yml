name: build-tests

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install package and development dependencies
        run: uv sync --locked
      - name: Run tests
        run: uv run --locked pytest
      - name: Build distributions
        run: uv build

  fenics-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: fenicsx-env
          environment-file: environment-fenicsx.yml
      - name: Install package and test dependencies
        run: uv pip install --python "$CONDA_PREFIX/bin/python" -e ".[test,service]"
      - name: Verify solver runtime
        run: |
          python - <<'PY'
          import dolfinx, mpi4py, petsc4py, dtcc_core, dtcc_sim
          assert dolfinx.__version__ == "0.11.0", dolfinx.__version__
          PY
      - name: Run FEniCSx tests
        run: python -m pytest -m "fenics and not expensive"
