[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dtcc-sim"
version = "0.1.0"
description = "DTCC Sim"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Anders Logg", email = "logg@chalmers.se" },
]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]
dependencies = ["dtcc-core @ git+https://github.com/dtcc-platform/dtcc-core.git@develop"]

[project.optional-dependencies]
test = ["pytest"]
docs = ["sphinx", "sphinx-immaterial"]
service = ["fastapi>=0.125.0", "uvicorn>=0.38.0", "celery[redis]>=5.4", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/dtcc-platform/dtcc-sim"
Source = "https://github.com/dtcc-platform/dtcc-sim"
Documentation = "https://platform.dtcc.chalmers.se/"

[tool.setuptools.packages.find]
where = ["."]
include = ["dtcc_sim*", "service*"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
  "simulation: simulation dataset or solver validation tests",
  "fenics: tests that require a FEniCSx/dolfinx runtime",
  "slow: intentionally small but slower numerical tests",
  "expensive: expensive/manual simulations; skipped unless --run-expensive is passed",
]
